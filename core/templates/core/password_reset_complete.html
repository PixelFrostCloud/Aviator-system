{% extends 'core/base.html' %}
{% block title %}Password updated | Pakabet{% endblock %}
{% block content %}
<section class="auth-screen auth-screen-single">
    <div class="auth-card password-reset-card">
        <span class="auth-kicker">Account recovery</span>
        <h2>Password updated</h2>
        <p class="auth-intro">Your password has been changed. You can now log in with your new password.</p>
        <a class="auth-submit auth-submit-link" href="{% url 'login' %}">Log in securely</a>
    </div>
</section>
{% endblock %}
