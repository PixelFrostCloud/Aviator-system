<aside class="account-sidebar" id="account-sidebar" aria-label="Account navigation">
    <button class="account-sidebar-close" id="account-sidebar-close" type="button" aria-label="Close account navigation">
        <span>Navigation</span><svg class="ui-icon" aria-hidden="true"><use href="#icon-close"></use></svg>
    </button>
    <a class="account-side-link {% if request.resolver_match.url_name == 'play' %}active{% endif %}" href="{% url 'play' %}"><svg class="ui-icon" aria-hidden="true"><use href="#icon-plane"></use></svg> All Bets</a>
    <a class="account-side-link {% if request.resolver_match.url_name == 'bet_history' %}active{% endif %}" href="{% url 'bet_history' %}"><svg class="ui-icon" aria-hidden="true"><use href="#icon-history"></use></svg> My Bets</a>
    <a class="account-side-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'dashboard' %}"><svg class="ui-icon" aria-hidden="true"><use href="#icon-chart"></use></svg> Top</a>
    <hr>
    <a class="account-side-link {% if request.resolver_match.url_name == 'profile' %}active{% endif %}" href="{% url 'profile' %}"><svg class="ui-icon" aria-hidden="true"><use href="#icon-user"></use></svg> Profile</a>
    <a class="account-side-link {% if request.resolver_match.url_name == 'wallet' %}active{% endif %}" href="{% url 'wallet' %}"><svg class="ui-icon" aria-hidden="true"><use href="#icon-wallet"></use></svg> Wallet</a>
    <a class="account-side-link {% if request.resolver_match.url_name == 'transactions' %}active{% endif %}" href="{% url 'transactions' %}"><svg class="ui-icon" aria-hidden="true"><use href="#icon-receipt"></use></svg> Transactions</a>
    <a class="account-side-link {% if request.resolver_match.url_name == 'referrals' %}active{% endif %}" href="{% url 'referrals' %}"><svg class="ui-icon" aria-hidden="true"><use href="#icon-users"></use></svg> Referrals</a>
    <hr>
    <a class="account-side-link {% if request.resolver_match.url_name == 'game_limits' %}active{% endif %}" href="{% url 'game_limits' %}"><svg class="ui-icon" aria-hidden="true"><use href="#icon-settings"></use></svg> Settings</a>
    <a class="account-side-link {% if request.resolver_match.url_name == 'how_to_play' %}active{% endif %}" href="{% url 'how_to_play' %}"><svg class="ui-icon" aria-hidden="true"><use href="#icon-help"></use></svg> Support</a>
    <a class="account-side-link {% if request.resolver_match.url_name == 'game_rules' %}active{% endif %}" href="{% url 'game_rules' %}"><svg class="ui-icon" aria-hidden="true"><use href="#icon-list"></use></svg> Game Rules</a>
    <a class="account-side-link" href="{% url 'logout' %}"><svg class="ui-icon" aria-hidden="true"><use href="#icon-logout"></use></svg> Logout</a>

    <div class="account-invite-card">
        <div class="invite-art"><svg class="ui-icon" aria-hidden="true"><use href="#icon-users"></use></svg></div>
        <strong>Invite & Earn</strong>
        <p>Earn 5% of a friend&#39;s first deposit, paid by Pakabet.</p>
        <a href="{% url 'referrals' %}">Invite Now</a>
    </div>
</aside>
<button class="account-nav-backdrop" id="account-nav-backdrop" type="button" aria-label="Close navigation" hidden></button>
