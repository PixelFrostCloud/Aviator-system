components:
  schemas:
    ApiErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Error message.
          nullable: true
          example: Invalid wallet
        code:
          type: string
          description: Error code.
          nullable: true
          example: BadRequest
      additionalProperties: false
    BankComboModel:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the bank.
          format: uuid
          example: 5e83b187-801e-410e-b76e-f491928547e0
        name:
          type: string
          description: The name of the bank.
          nullable: true
          example: Stanbic Bank
        code:
          type: string
          description: The Bank Identification Code, also known as swift code.
          nullable: true
          example: ABCDUGKAXXX
      additionalProperties: false
    BankDisbursementRequest:
      required:
        - accountName
        - accountNumber
        - amount
        - walletId
      type: object
      properties:
        bankId:
          type: string
          description: The reference BankID from the ioTec platform, set this if you do
            not have the Bank Identification Code
          format: uuid
