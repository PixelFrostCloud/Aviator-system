  /api/collections/collect/card:
    post:
      tags:
        - Collections
      summary: Initiate Card Collection
      description: >-
        This endpoint is used to perform a card (Visa/MasterCard) collection
        request from a specified payer to your Pay wallet, processed via PegPay.
                    
        Unlike mobile money, `Payer` must be the customer's email address rather
        than a phone number.
                    
        The transaction flow works as follows:

        1. This endpoint is called and returns a `Pending` transaction,
        including a `cardRedirectUrl`.

        2. Redirect the customer's browser to `cardRedirectUrl`. This
        auto-submits the customer to PegPay's hosted payment page, and the
        transaction moves to `SentToVendor`.

        3. The customer enters their card details and completes payment on
        PegPay.

        4. PegPay redirects the customer back to us; we independently confirm
        the authoritative outcome with PegPay before finalizing the status to
        `Success` or `Failed`.

        5. If you supplied a `RedirectUrl` in the request, the customer's
        browser is redirected there with the outcome (`id`, `status`,
        `statusCode`, `statusMessage`, etc.) as query parameters once payment
        finishes. Otherwise, a generic confirmation page is shown.
                    
        You can check the transaction status at any time using:

        ```

        GET api/collections/status/{transactionId}

        ```
      parameters:
        - name: Authorization
          in: header
          description: OAuth2 bearer token, got from id.iotec.io
          required: true
          schema:
            type: string
          example: Bearer <jwt-token>
      requestBody:
